services:
  - type: web
    name: word-by-word
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MAX_TOKENS
        sync: false
      - key: MAX_REWRITES
        sync: false
      - key: PROMPT_STYLE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "20"

  - type: web
    name: word-by-word-ui
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Paste the API service's public URL here after it deploys once,
      # e.g. https://word-by-word-xxxx.onrender.com — the UI proxies /api/*
      # to it, so no CORS configuration is needed.
      - key: BACKEND_URL
        sync: false
